[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "po-to-menu-cost"
version = "0.1.0"
description = "Turn supplier purchase orders into menu-level cost and margin."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
po-to-menu-cost = "po_to_menu_cost.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
